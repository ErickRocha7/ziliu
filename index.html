<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ziliu, uma plataforma SPA de ensino de matemática com experiência visual premium.">
    <title>Ziliu | Matemática Visual</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/componentes.css">
    <link rel="stylesheet" href="css/canvas.css">
    <link rel="stylesheet" href="css/animacoes.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="ziliu-app">

        <!-- Topbar -->
        <header class="topbar">
            <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false">
                <i data-lucide="menu"></i>
            </button>
            <div class="logo">Ziliu</div>
            <div class="topbar-center">
                <span class="current-series">6º Ano</span>
                <span class="separator">›</span>
                <span class="current-lesson">Conjuntos Numéricos</span>
            </div>
            <div class="user-profile">
                <span class="avatar">M</span>
                <span class="username">Matemática</span>
            </div>
        </header>

        <div class="app-body">

            <!-- Sidebar -->
            <nav class="sidebar" aria-label="Navegação de aulas">
                <div class="sidebar-scroll"></div>
            </nav>

            <!-- Overlay Mobile -->
            <div class="sidebar-overlay"></div>

            <!-- Main -->
            <main class="main-content">
                <div class="canvas-container">
                    <div class="canvas-blank-area">
                        <!-- Área de cabeçalho fixo da aula -->
                        <div class="lesson-header">
                            <div class="lesson-kicker"></div>
                            <h1 class="lesson-heading"></h1>
                            <p class="lesson-summary"></p>
                        </div>
                        <!-- Palco dinâmico para o conteúdo da etapa (16:9) -->
                        <div id="canvas-stage"></div>
                        <!-- Placeholder (exibido apenas quando não há aula) -->
                        <div class="canvas-placeholder">
                            Selecione uma aula
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="navigation-footer">
                    <div class="progress-wrapper">
                        <div class="progress-info">
                            <span id="progress-text">Etapa 1 de 10</span>
                        </div>
                        <div class="progress-bar" aria-hidden="true">
                            <div class="progress-fill"></div>
                        </div>
                    </div>
                    <div class="controls-wrapper">
                        <button class="nav-btn btn-secondary" id="btn-voltar">Voltar</button>
                        <button class="nav-btn btn-primary" id="btn-avancar">Avançar</button>
                    </div>
                </footer>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
